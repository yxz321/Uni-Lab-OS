plate_reader:
  name: 多功能酶标仪
  name_en: Microplate Reader
  manufacturer: ''
  category:
  - 酶标仪
  tags:
  - 表征设备
  - 生命体系
  - 智慧表征与检测中心
  - 微孔板检测与高通量筛选
  - 细胞生物学研究
  - 酶标仪
  description: 用于读取微孔板中各孔的吸光度、荧光和发光信号的实验仪器，常用于生化分析、细胞实验和板式检测流程。
  description_en: An instrument used to read absorbance, fluorescence, and luminescence
    signals from wells in a microplate, commonly used for biochemical assays, cell-based
    experiments, and plate-based analytical workflows.
  actions:
    auto-assign_child_resource:
      description: 将微孔板资源分配并装载到酶标仪中。
      description_en: Assign and load a microplate resource into the plate reader.
    auto-close:
      description: 关闭酶标仪的舱门或托盘，以准备检测。
      description_en: Close the plate reader door or tray to prepare for measurement.
    auto-open:
      description: 打开酶标仪的舱门或托盘，以便放入或取出微孔板。
      description_en: Open the plate reader door or tray to insert or remove a microplate.
    auto-read_absorbance:
      description: 在指定波长下读取微孔板各孔的吸光度。
      description_en: Read absorbance from the wells of a microplate at a specified
        wavelength.
    auto-read_fluorescence:
      description: 在指定激发波长、发射波长和焦高条件下读取微孔板各孔的荧光信号。
      description_en: Read fluorescence from the wells of a microplate using specified
        excitation wavelength, emission wavelength, and focal height.
    auto-read_luminescence:
      description: 在指定焦高条件下读取微孔板各孔的发光信号。
      description_en: Read luminescence from the wells of a microplate at a specified
        focal height.
    auto-serialize:
      description: 序列化酶标仪的当前状态或资源信息。
      description_en: Serialize the current state or resource information of the plate
        reader.
    auto-get_plate:
      description: 获取当前装载的微孔板。
      description_en: Get the currently loaded microplate.
