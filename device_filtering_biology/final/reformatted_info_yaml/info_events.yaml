events:
  name: xArm协作机械臂
  name_en: xArm collaborative robotic arm
  manufacturer: UFACTORY
  category:
  - 机械臂
  tags:
  - 物流/机械
  - 机器人与移动平台
  - 实验室自动化与仪器集成
  - 实验室机械臂自动化与样品搬运
  - 样品/探针定位与运动控制
  - 机械臂
  description: xArm协作机械臂是一种多关节机器人，用于实验室自动化中的样品转运、定位、抓取和重复操作任务。该设备可提供笛卡尔位置、关节状态、运行模式、告警、温度以及电机相关状态等运行信息，适合自动化操作与过程监测。
  description_en: The xArm collaborative robotic arm is a multi-joint robot used in
    laboratory automation for sample transfer, positioning, gripping, and repetitive
    handling tasks. The device can report Cartesian position, joint status, operating
    mode, alarms, temperature, and motor-related states, making it suitable for automated
    operations and process monitoring.
  actions:
    auto-register_report_callback:
      description: 订阅机械臂综合状态上报
      description_en: Subscribe to comprehensive robot status reports
