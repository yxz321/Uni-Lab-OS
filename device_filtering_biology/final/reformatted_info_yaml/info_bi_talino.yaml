bi_talino:
  name: BITalino 生理信号采集板
  name_en: BITalino biosignal acquisition board
  manufacturer: PLUX Wireless Biosignals
  category:
  - 模拟输入数据采集模块
  tags:
  - 表征设备
  - 生命体系
  - 实验仪器数据采集与联机控制
  - 模拟输入数据采集模块
  description: BITalino 是一款便携式蓝牙生理信号采集设备，提供多路模拟输入通道，可用于采集和传输实验中的生理或其他低频模拟传感器信号。它常用于教学、原型开发和可穿戴生理测量实验。
  description_en: BITalino is a portable Bluetooth biosignal acquisition device with
    multiple analog input channels for collecting and streaming physiological or other
    low-frequency analog sensor signals in laboratory experiments. It is commonly
    used for teaching, prototyping, and wearable physiology measurements.
  actions:
    auto-connect:
      description: 连接到 BITalino 设备并订阅其实时数据流。
      description_en: Connect to the BITalino device and subscribe to its live data
        stream.
    auto-disconnect:
      description: 停止数据流并断开与 BITalino 设备的连接。
      description_en: Stop the data stream and disconnect from the BITalino device.
    auto-set_callback:
      description: 设置用于接收设备实时采样数据的回调函数。
      description_en: Set a callback function to receive real-time sample data from
        the device.
    auto-start:
      description: 设置采样率和通道后，开始从设备采集数据。
      description_en: Configure the sampling rate and channels, then start data acquisition
        from the device.
    auto-stop:
      description: 停止设备的数据采集。
      description_en: Stop data acquisition on the device.
