camera:
  name: 工业相机
  name_en: GenICam camera
  manufacturer: ''
  category:
  - 科学相机
  - 工业相机
  tags:
  - 表征设备
  - 智慧表征与检测中心
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 科学相机
  - 实验成像与机器视觉
  - 工业相机
  description: 一种用于实验成像和机器视觉采集的数字相机，可连续或触发采集图像，并可调曝光时间、增益、帧率、像素格式和采集区域，常用于显微观察、定位检测和通用视觉测量。
  description_en: A digital machine-vision camera for laboratory imaging and visual
    data acquisition. It supports continuous or triggered image capture and allows
    adjustment of exposure time, gain, frame rate, pixel format, and acquisition region,
    making it suitable for microscopy, alignment, inspection, and general imaging
    measurements.
  actions:
    auto-create_buffers:
      description: 为图像采集流分配缓冲区
      description_en: allocate buffers for image acquisition
    auto-try_get_frame:
      description: 尝试获取最新图像帧
      description_en: try to get the latest image frame
    auto-get_frame:
      description: 获取最新图像帧
      description_en: get the latest image frame
    auto-trigger:
      description: 触发相机采集一帧图像
      description_en: trigger the camera to acquire one image
    auto-get_device:
      description: 获取已连接相机设备
      description_en: get the connected camera device
    auto-get_sensor_size:
      description: 获取传感器尺寸
      description_en: get sensor size
    auto-get_region:
      description: 获取图像采集区域
      description_en: get the image acquisition region
    auto-set_region:
      description: 设置图像采集区域
      description_en: set the image acquisition region
    auto-get_exposure_time:
      description: 获取曝光时间
      description_en: get exposure time
    auto-get_payload:
      description: 获取图像载荷大小
      description_en: get image payload size
    auto-get_frame_rate:
      description: 获取帧率
      description_en: get frame rate
    auto-set_frame_rate:
      description: 设置帧率
      description_en: set frame rate
    auto-get_gain:
      description: 获取增益
      description_en: get gain
    auto-set_gain:
      description: 设置增益
      description_en: set gain
    auto-get_vendor_name:
      description: 获取厂商名称
      description_en: get vendor name
    auto-get_model_name:
      description: 获取型号名称
      description_en: get model name
    auto-get_device_id:
      description: 获取设备标识
      description_en: get device ID
    auto-set_acquisition_mode:
      description: 设置采集模式
      description_en: set acquisition mode
    auto-set_trigger_source:
      description: 设置触发源
      description_en: set trigger source
    auto-get_trigger_source:
      description: 获取触发源
      description_en: get trigger source
    auto-start_acquisition:
      description: 开始图像采集
      description_en: start image acquisition
    auto-start_acquisition_trigger:
      description: 开始触发采集
      description_en: start triggered acquisition
    auto-start_acquisition_continuous:
      description: 开始连续采集
      description_en: start continuous acquisition
    auto-stop_acquisition:
      description: 停止图像采集
      description_en: stop image acquisition
    auto-create_stream:
      description: 创建图像采集数据流
      description_en: create an image acquisition stream
    auto-get_pixel_format_as_string:
      description: 获取像素格式
      description_en: get pixel format
    auto-cleanup:
      description: 释放相机资源
      description_en: release camera resources
