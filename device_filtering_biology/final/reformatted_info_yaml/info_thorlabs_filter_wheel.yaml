thorlabs_filter_wheel:
  name: Thorlabs电动滤光轮
  name_en: Thorlabs Motorized Filter Wheel
  manufacturer: Thorlabs
  category:
  - 电动滤光片转轮
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 电动滤光片转轮
  description: 用于控制Thorlabs FW102C及相关型号的电动滤光轮，在显微镜和光学实验中实现不同滤光片位置的切换。该设备可用于快速选择光路中的滤光片，适合荧光成像和一般光学测量场景。
  description_en: A motorized filter wheel for controlling Thorlabs FW102C and related
    models, used in microscopy and optical experiments to switch between filter positions.
    It enables rapid selection of filters in the optical path for fluorescence imaging
    and general optical measurements.
  actions:
    initialize:
      description: 初始化滤光轮并建立通信。
      description_en: Initialize the filter wheel and establish communication.
