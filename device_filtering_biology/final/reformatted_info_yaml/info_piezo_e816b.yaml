piezo_e816b:
  name: PI E-816B 压电定位控制器
  name_en: PI E-816B Piezo Positioning Controller
  manufacturer: Physik Instrumente (PI)
  category:
  - 位置控制器
  - 压电定位控制器
  tags:
  - 表征设备
  - 精密定位与运动控制
  - 智慧表征与检测中心
  - 显微成像与光学显微实验
  - 样品/探针定位与运动控制
  - 位置控制器
  - 压电定位控制器
  description: 用于控制压电定位器或压电位移台的精密位置移动与读回，提供绝对移动、当前位置查询和行程范围查询，适合显微成像、精密扫描与对焦定位等实验场景。
  description_en: A piezo positioning controller used to drive and read back a piezo
    actuator or piezo stage. It supports absolute moves, current position queries,
    and travel-range queries for microscopy, precision scanning, and focus positioning
    experiments.
  actions:
    auto-MoveTo:
      description: 将指定通道移动到目标位置。
      description_en: Move the specified channel to a target position.
    auto-GetPos:
      description: 获取指定通道的当前位置。
      description_en: Get the current position of the specified channel.
    auto-GetControlReady:
      description: 获取控制器是否就绪。
      description_en: Get whether the controller is ready.
    auto-GetChannelObject:
      description: 获取通道对象。
      description_en: Get the channel object.
    auto-GetChannelPhase:
      description: 获取通道相位信息。
      description_en: Get the channel phase information.
    auto-GetMin:
      description: 获取指定通道的最小位置范围。
      description_en: Get the minimum position limit of the specified channel.
    auto-GetMax:
      description: 获取指定通道的最大位置范围。
      description_en: Get the maximum position limit of the specified channel.
