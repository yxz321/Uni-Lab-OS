fw102_b:
  name: 电动滤光片转轮
  name_en: Motorized Filter Wheel
  manufacturer: Thorlabs
  category:
  - 电动滤光片转轮
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 电动滤光片转轮
  description: 一款多工位电动滤光片转轮，可在多个滤光片位置之间快速切换。常用于显微成像、荧光实验和光学测量中，以选择不同波段或不同类型的光学滤片。
  description_en: A multi-position motorized filter wheel that switches quickly between
    installed optical filters. It is commonly used in microscopy, fluorescence experiments,
    and optical measurements to select different wavelength bands or filter types.
  actions:
    auto-getPos:
      description: 获取当前滤光片位置。
      description_en: Get the current filter wheel position.
    auto-setPos:
      description: 设置滤光片位置。
      description_en: Set the filter wheel position.
