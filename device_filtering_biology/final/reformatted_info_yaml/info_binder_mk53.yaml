binder_mk53:
  name: Binder MK 53 气候箱
  name_en: Binder MK 53 climate chamber
  manufacturer: BINDER
  category:
  - 气候箱
  tags:
  - 实验执行&合成设备
  - 环境控制与稳定性测试
  - 气候箱培养与稳定性试验
  - 气候箱
  description: Binder MK 53 是一款实验室气候箱/环境试验箱，用于在受控温度条件下放置样品并进行培养、预处理或稳定性测试。该设备具备温度设定与监测功能，并可反馈门状态和运行模式等基本状态信息。
  description_en: The Binder MK 53 is a laboratory climate chamber used to hold samples
    under controlled temperature conditions for incubation, conditioning, and stability
    testing. It supports temperature setpoint control and monitoring, and provides
    basic status information such as door state and operating mode.
  actions:
    auto-init:
      description: 初始化气候箱通信与操作地址配置。
      description_en: Initialize the climate chamber communication and operation address
        configuration.
    auto-get_temperature:
      description: 获取箱体当前温度。
      description_en: Get the current chamber temperature.
    auto-get_temperature_target:
      description: 获取温度设定值。
      description_en: Get the temperature setpoint.
    auto-get_door_open:
      description: 获取箱门是否打开。
      description_en: Get whether the chamber door is open.
    auto-get_mode:
      description: 获取当前运行模式。
      description_en: Get the current operating mode.
    auto-set_temperature:
      description: 设置温度设定值。
      description_en: Set the temperature setpoint.
    auto-read:
      description: 读取设备寄存器数据。
      description_en: Read device register data.
    auto-write:
      description: 写入设备寄存器值。
      description_en: Write a device register value.
