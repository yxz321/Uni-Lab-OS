mighty_mini:
  name: Mighty Mini注射泵
  name_en: Mighty Mini Syringe Pump
  manufacturer: Harvard Apparatus
  category:
  - 注射泵
  tags:
  - 实验执行&合成设备
  - 溶液配制与反应
  - 液体输送与定量分配
  - 注射泵
  description: 一款实验室用小型注射泵，用于以设定流速精确输送液体并进行持续输注。常用于微流控、化学加液、样品处理和生物实验中的定量给液。
  description_en: A compact laboratory syringe pump used to deliver liquids at a defined
    flow rate for precise, continuous infusion. It is commonly used for microfluidics,
    reagent addition, sample handling, and other experiments requiring accurate liquid
    dosing.
  actions:
    auto-setflowrate:
      description: 设置输注流速。
      description_en: Set the infusion flow rate.
    auto-infuse:
      description: 开始输注液体。
      description_en: Start infusing liquid.
    auto-stop:
      description: 停止输注。
      description_en: Stop infusion.
