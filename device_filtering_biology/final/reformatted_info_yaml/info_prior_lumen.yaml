prior_lumen:
  name: Prior Lumen显微照明光源
  name_en: Prior Lumen Illumination Source
  manufacturer: Prior Scientific
  category:
  - 显微照明光源
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 显微照明光源
  description: 用于显微成像系统的照明光源，驱动中主要提供光源开关与状态查询功能。代码说明其借用激光器界面控件进行操作，但实际对象更像是可开关的显微照明光源而非激光器。
  description_en: An illumination source used in a microscopy imaging system. The
    driver mainly provides on/off control and state query. The code notes that it
    pretends to be a laser only to reuse laser GUI controls, but the controlled object
    is better described as a switchable microscopy light source rather than a laser.
  actions:
    auto-IsOn:
      description: 获取光源当前开关状态。
      description_en: Get the current on/off state of the light source.
    auto-TurnOn:
      description: 打开照明光源。
      description_en: Turn on the illumination source.
    auto-TurnOff:
      description: 关闭照明光源。
      description_en: Turn off the illumination source.
