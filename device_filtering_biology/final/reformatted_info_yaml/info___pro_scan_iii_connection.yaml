__pro_scan_iii_connection:
  name: Prior ProScan III 显微镜控制器
  name_en: Prior ProScan III microscope controller
  manufacturer: Prior
  category:
  - 显微镜自动化控制器
  tags:
  - 表征设备
  - 智慧表征与检测中心
  - 实验室自动化与仪器集成
  - 物化表征测试中心
  - 显微成像与光学显微实验
  - 显微镜自动化控制器
  description: Prior ProScan III 是一款用于显微镜系统的控制器，可连接并控制多个滤轮。它常用于荧光显微和多通道成像实验中，以切换滤光片位置、选择成像通道并协调显微镜附件的工作。
  description_en: The Prior ProScan III is a microscope system controller that can
    connect to and control multiple filter wheels. It is commonly used in fluorescence
    microscopy and multichannel imaging to switch filter positions, select imaging
    channels, and coordinate microscope accessories.
  actions:
    auto-command:
      description: 向控制器发送通用命令。
      description_en: Send a general command to the controller.
    auto-readline:
      description: 读取控制器返回的一行响应。
      description_en: Read one line of response from the controller.
    auto-read_until_timeout:
      description: 持续读取控制器响应直到超时，用于清空通信缓冲。
      description_en: Read controller responses until timeout, typically to clear
        the communication buffer.
    auto-get_command:
      description: 发送查询命令并获取控制器返回值。
      description_en: Send a query command and return the controller response.
    auto-move_command:
      description: 发送运动类命令并等待控制器完成运动。
      description_en: Send a motion-related command and wait for the controller to
        report movement completion.
    auto-set_command:
      description: 发送设置类命令以更改控制器或所连滤轮的状态。
      description_en: Send a setting command to change the state of the controller
        or a connected filter wheel.
    auto-get_description:
      description: 查询控制器或所连设备的描述信息。
      description_en: Query descriptive information about the controller or a connected
        device.
    auto-changed_timeout:
      description: 更改与控制器通信时的超时设置。
      description_en: Change the communication timeout used with the controller.
    auto-assert_filterwheel_number:
      description: 检查指定滤轮编号是否有效。
      description_en: Check whether the specified filter wheel number is valid.
    auto-has_filterwheel:
      description: 检查指定接口上是否连接了滤轮。
      description_en: Check whether a filter wheel is connected on the specified interface.
    auto-get_n_filter_positions:
      description: 获取指定滤轮的可用位置数量。
      description_en: Get the number of available positions on the specified filter
        wheel.
    auto-get_filter_position:
      description: 获取指定滤轮的当前位置。
      description_en: Get the current position of the specified filter wheel.
    auto-set_filter_position:
      description: 设置指定滤轮的当前位置。
      description_en: Set the current position of the specified filter wheel.
