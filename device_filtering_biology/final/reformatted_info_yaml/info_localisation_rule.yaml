localisation_rule:
  name: 定位分析规则
  name_en: Localization Analysis Rule
  manufacturer: ''
  category:
  - 定位分析工作流规则
  tags:
  - 后处理设备
  - 实验数据可视化与分析
  - 显微成像与光学显微实验
  - 显微定位重建与集群分析
  - 定位分析工作流规则
  description: 这不是物理实验仪器，而是一个用于显微成像数据处理的软件规则对象。它用于监视采集帧和事件数据，准备结果文件与元数据，并在数据采集完成后触发或推进定位分析流程，常见于显微镜图像的定位重建或集群分析任务中。
  description_en: This is not a physical lab instrument but a software rule object
    for microscopy data processing. It monitors incoming frames and event data, prepares
    result files and metadata, and triggers or advances localization analysis once
    data acquisition is complete, typically in microscope image localization or cluster-based
    analysis workflows.
  actions:
    auto-prepare:
      description: 准备定位分析任务所需的结果文件、元数据和启动参数。
      description_en: Prepare the result files, metadata, and launch parameters required
        for the localization analysis task.
    auto-on_data_complete:
      description: 在输入数据全部完成后触发定位分析的后续处理流程。
      description_en: Trigger the follow-up localization analysis workflow after all
        input data has been completed.
