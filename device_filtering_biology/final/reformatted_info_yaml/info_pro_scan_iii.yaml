pro_scan_iii:
  name: Prior ProScan III 显微镜附件控制器
  name_en: Prior ProScan III Microscope Accessory Controller
  manufacturer: Prior
  category:
  - 显微镜自动化控制器
  tags:
  - 表征设备
  - 智慧表征与检测中心
  - 实验室自动化与仪器集成
  - 显微成像与光学显微实验
  - 仪器发现与驱动匹配
  - 显微镜自动化控制器
  description: 用于显微镜系统的物理控制器，可管理连接到 ProScan III 的附件设备；从当前证据看，主要包括最多三个滤轮接口。它用于在实验中统一协调已连接滤轮等附件的通信与设备发现。
  description_en: A physical controller for microscope systems that manages accessories
    connected to the ProScan III; based on the available evidence, this mainly includes
    up to three filter wheel connections. It is used in laboratory microscopy setups
    to coordinate communication with attached accessories and to discover managed
    devices.
  actions:
    auto-devices:
      description: 自动发现并列出该控制器当前管理的已连接设备，例如滤轮。
      description_en: Automatically discover and list the devices currently managed
        by the controller, such as attached filter wheels.
