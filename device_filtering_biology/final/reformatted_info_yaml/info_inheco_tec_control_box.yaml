inheco_tec_control_box:
  name: INHECO 温控控制盒
  name_en: INHECO TEC Control Box
  manufacturer: INHECO
  category:
  - PID过程控制器
  tags:
  - 实验执行&合成设备
  - 实验室自动化与仪器集成
  - 过程控制与工业仪表实验
  - 外接设备恒温控制
  - PID过程控制器
  description: 一款用于实验室温度控制模块的热电温控控制盒，可为加热/制冷附件提供控制与状态交互，常用于样品、板位或实验流程中的温度管理。
  description_en: A thermoelectric temperature control box for laboratory temperature-control
    modules. It provides control and device interaction for heating/cooling accessories,
    and is commonly used for managing sample, plate, or workflow temperatures.
  actions:
    auto-reset_action_display:
      description: 重置控制盒的动作显示界面。
      description_en: Reset the action display on the control box.
    auto-send_command:
      description: 向温控控制盒发送底层命令并读取返回结果。
      description_en: Send a low-level command to the temperature control box and
        read back the response.
    auto-set_touchscreen:
      description: 启用或禁用控制盒触摸屏。
      description_en: Enable or disable the control box touchscreen.
    auto-setup:
      description: 初始化并建立与温控控制盒的通信。
      description_en: Initialize the device and establish communication with the temperature
        control box.
    auto-stop:
      description: 停止温控控制盒的当前运行。
      description_en: Stop the current operation of the temperature control box.
