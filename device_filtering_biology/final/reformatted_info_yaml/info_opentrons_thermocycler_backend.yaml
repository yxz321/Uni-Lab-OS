opentrons_thermocycler_backend:
  name: Opentrons PCR热循环仪
  name_en: Opentrons Thermocycler
  manufacturer: Opentrons
  category:
  - 普通PCR仪
  tags:
  - 实验执行&合成设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 基因编辑、分子生物学与育种
  - 普通PCR仪
  description: 用于PCR等热循环实验的台式热循环仪模块，配有可开合的加热盖和可精确控温的样品块，可按预设程序执行多步升降温循环。常用于DNA扩增、酶反应孵育和分子生物学样品热处理。
  description_en: A benchtop thermocycler module for PCR and other thermal cycling
    workflows, featuring an openable heated lid and a temperature-controlled sample
    block. It runs programmed multi-step temperature profiles for DNA amplification,
    enzymatic incubations, and molecular biology sample heating.
  actions:
    auto-serialize:
      description: 导出设备状态
      description_en: serialize device state
    auto-open_lid:
      description: 打开热循环仪盖
      description_en: open the thermocycler lid
    auto-close_lid:
      description: 关闭热循环仪盖
      description_en: close the thermocycler lid
    auto-set_block_temperature:
      description: 设置样品块温度
      description_en: set the block temperature
    auto-set_lid_temperature:
      description: 设置上盖温度
      description_en: set the lid temperature
    auto-deactivate_block:
      description: 关闭样品块加热
      description_en: deactivate the block heater
    auto-deactivate_lid:
      description: 关闭上盖加热
      description_en: deactivate the lid heater
    auto-run_protocol:
      description: 运行热循环程序
      description_en: run a thermocycling protocol
    auto-get_block_current_temperature:
      description: 获取样品块当前温度
      description_en: get the current block temperature
    auto-get_block_target_temperature:
      description: 获取样品块目标温度
      description_en: get the target block temperature
    auto-get_lid_current_temperature:
      description: 获取上盖当前温度
      description_en: get the current lid temperature
    auto-get_lid_target_temperature:
      description: 获取上盖目标温度
      description_en: get the target lid temperature
    auto-get_lid_open:
      description: 获取上盖是否打开
      description_en: get whether the lid is open
    auto-get_lid_status:
      description: 获取上盖状态
      description_en: get the lid status
    auto-get_block_status:
      description: 获取样品块状态
      description_en: get the block status
    auto-get_hold_time:
      description: 获取保温时间
      description_en: get the hold time
    auto-get_current_cycle_index:
      description: 获取当前循环序号
      description_en: get the current cycle index
    auto-get_total_cycle_count:
      description: 获取总循环次数
      description_en: get the total cycle count
    auto-get_current_step_index:
      description: 获取当前步骤序号
      description_en: get the current step index
    auto-get_total_step_count:
      description: 获取总步骤数
      description_en: get the total step count
