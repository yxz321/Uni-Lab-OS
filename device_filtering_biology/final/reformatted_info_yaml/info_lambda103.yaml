lambda103:
  name: Sutter Lambda 10-3多滤光轮控制器
  name_en: Sutter Lambda 10-3 multi-filter wheel controller
  manufacturer: Sutter Instrument
  category:
  - 电动滤光片转轮
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 电动滤光片转轮
  description: Sutter Lambda 10-3 是用于显微成像等光学实验的高性能多滤光轮控制器，可同步控制最多 3 个滤光轮及快门，实现快速滤光片切换与激发/发射通道管理。
  description_en: The Sutter Lambda 10-3 is a high-performance multi-filter wheel
    controller for microscopy and optical imaging workflows. It supports synchronized
    control of up to three filter wheels and shutters for rapid filter switching and
    excitation/emission path management.
  actions:
    auto-flush:
      description: 刷新设备通信缓冲区。
      description_en: Flush the device communication buffer.
    auto-motorsON_async:
      description: 开启所有滤光轮电机电源。
      description_en: Power on all filter wheel motors.
    auto-reset_async:
      description: 复位控制器。
      description_en: Reset the controller.
    auto-status_async:
      description: 查询设备状态。
      description_en: Query the device status.
    auto-open_A:
      description: 打开 A 路快门。
      description_en: Open shutter A.
    auto-position:
      description: 设置滤光轮位置和切换速度；可控制 A/C 轮组或 B 轮。
      description_en: Set the filter wheel position and switching speed; controls
        wheel group A/C or wheel B.
    auto-motorsON:
      description: 开启所有滤光轮电机电源。
      description_en: Power on all filter wheel motors.
    auto-status:
      description: 查询设备状态。
      description_en: Query the device status.
    auto-remote:
      description: 设置本地/远程控制模式。
      description_en: Set the local/remote control mode.
    auto-reset:
      description: 复位控制器。
      description_en: Reset the controller.
