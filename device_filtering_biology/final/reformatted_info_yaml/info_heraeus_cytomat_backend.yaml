heraeus_cytomat_backend:
  name: Heraeus Cytomat自动微孔板培养存储系统
  name_en: Heraeus Cytomat automated microplate incubator
  manufacturer: Heraeus
  category:
  - 微孔板自动培养存储系统
  tags:
  - 器件/细胞设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 细胞生物学研究
  - 微孔板样品孵育与混匀
  - 微孔板自动培养存储系统
  description: 这是一种用于自动化实验流程的微孔板培养与存储设备，带有温度控制、振荡和传送工位，可在内部板架中存放微孔板，并通过舱门与装载托盘完成进出板。常用于细胞培养、样品孵育以及与机器人联用的高通量实验流程。
  description_en: An automated microplate incubator and storage unit for laboratory
    automation workflows. It provides temperature control, shaking, and a transfer/loading
    station to move plates between internal racks and external handlers. It is used
    for microplate incubation, storage, and robotic high-throughput laboratory workflows.
  actions:
    auto-close_door:
      description: 关闭培养箱舱门。
      description_en: Close the incubator door.
    auto-fetch_plate_to_loading_tray:
      description: 将微孔板从内部存储位取到装载/传送工位。
      description_en: Fetch a microplate from internal storage to the loading/transfer
        station.
    auto-initialize:
      description: 初始化培养箱及其内部传板机构。
      description_en: Initialize the incubator and its internal plate-handling mechanism.
    auto-open_door:
      description: 打开培养箱舱门。
      description_en: Open the incubator door.
    auto-read_plate_detection_xfer:
      description: 读取传送工位上的微孔板检测状态。
      description_en: Read the plate-detection status at the transfer station.
    auto-serialize:
      description: 导出设备当前配置或状态信息。
      description_en: Export the current device configuration or state information.
    auto-set_racks:
      description: 设置内部板架或堆栈配置。
      description_en: Define the internal rack or stacker configuration.
    auto-set_temperature:
      description: 设置温度。
      description_en: set temperature
    auto-setup:
      description: 建立通信并使设备进入可操作状态。
      description_en: Establish communication and place the device into an operational
        state.
    auto-start_shaking:
      description: 开始对微孔板进行振荡。
      description_en: Start shaking the microplates.
    auto-stop:
      description: 停止设备运行。
      description_en: Stop device operation.
    auto-stop_shaking:
      description: 停止振荡。
      description_en: Stop shaking.
    auto-take_in_plate:
      description: 将微孔板从传送工位送入指定存储位。
      description_en: Move a microplate from the transfer station into the specified
        storage location.
    auto-wait_for_transfer_station:
      description: 等待传送工位达到指定占用状态。
      description_en: Wait for the transfer station to reach the requested occupied
        state.
    auto-get_temperature:
      description: 获取温度。
      description_en: get temperature
    auto-deserialize:
      description: 从已保存的信息恢复设备配置或状态。
      description_en: Restore the device configuration or state from saved information.
