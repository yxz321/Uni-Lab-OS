robot:
  name: Mecademic机械臂
  name_en: Mecademic robotic arm
  manufacturer: Mecademic
  category:
  - 机械臂
  tags:
  - 物流/机械
  - 实验室自动化与仪器集成
  - 机器人与移动平台
  - 实验室机器人操作与样品转运
  - 实验室机械臂自动化与样品搬运
  - 样品/探针定位与运动控制
  - 机械臂
  description: 用于控制 Mecademic 六轴机械臂及其末端工具的机器人系统，可执行关节与笛卡尔运动、夹爪抓取、真空吸附、I/O 控制、程序运行和实时状态监测，适用于实验室自动化中的取放、定位、转运与样品处理。
  description_en: A robotic system for controlling a Mecademic six-axis robotic arm
    and its end tools. It supports joint and Cartesian motion, gripper handling, vacuum
    pick-up, I/O control, program execution, and real-time monitoring for laboratory
    automation tasks such as pick-and-place, positioning, transfer, and sample handling.
