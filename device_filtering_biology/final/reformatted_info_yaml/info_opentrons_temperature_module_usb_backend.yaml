opentrons_temperature_module_usb_backend:
  name: Opentrons 温度模块
  name_en: Opentrons Temperature Module
  manufacturer: Opentrons
  category:
  - 微孔板温控模块
  tags:
  - 备料&前处理设备
  - 实验执行&合成设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 外接设备恒温控制
  - 微孔板样品孵育与混匀
  - 微孔板温控模块
  description: Opentrons 温度模块是一种用于实验室自动化平台的温控附件，可对样品板或其他小型实验容器进行加热或冷却并维持设定温度，常用于样品孵育、试剂保冷及温度敏感实验流程。
  description_en: The Opentrons Temperature Module is a temperature-control accessory
