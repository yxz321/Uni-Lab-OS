a4_s_backend:
  name: A4S微孔板热封机
  name_en: A4S Microplate Heat Sealer
  manufacturer: Azenta Life Sciences
  category:
  - 封膜仪
  tags:
  - 备料&前处理设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 移液站产品
  - 封膜仪
  description: A4S是一种用于实验室微孔板热封的自动封膜设备，可对PCR板、深孔板或储样板施加受控温度和时间，将封膜材料压合到板口以实现密封。它适用于样品储存、避免蒸发与污染，以及自动化样品处理流程中的板封口步骤。
  description_en: The A4S is an automated microplate heat sealer used in laboratories
    to apply sealing films to microplates under controlled temperature and time conditions.
    It is used with PCR plates, deep-well plates, or storage plates to create a secure
    seal for sample storage, evaporation and contamination control, and automated
    sample-processing workflows.
  actions:
    auto-close:
      description: 关闭封膜机构。
      description_en: Close the sealing mechanism.
    auto-open:
      description: 打开封膜机构。
      description_en: Open the sealing mechanism.
    auto-seal:
      description: 按设定温度和时长执行一次热封。
      description_en: Perform a heat-sealing cycle using the specified temperature
        and duration.
    auto-send_command:
      description: 发送设备原始控制命令。
      description_en: Send a raw control command to the device.
    auto-set_heater:
      description: 打开或关闭加热器。
      description_en: Turn the heater on or off.
    auto-set_temperature:
      description: 设置温度。
      description_en: Set the temperature.
    auto-set_time:
      description: 设置封膜时间。
      description_en: Set the sealing time.
    auto-setup:
      description: 初始化设备并准备运行。
      description_en: Initialize the device and prepare it for operation.
    auto-stop:
      description: 停止当前操作。
      description_en: Stop the current operation.
    auto-system_reset:
      description: 复位设备系统。
      description_en: Reset the device system.
    auto-get_status:
      description: 获取系统状态。
      description_en: Get the system status.
    auto-get_temperature:
      description: 获取温度。
      description_en: Get the temperature.
    auto-get_remaining_time:
      description: 获取剩余时间。
      description_en: Get the remaining time.
