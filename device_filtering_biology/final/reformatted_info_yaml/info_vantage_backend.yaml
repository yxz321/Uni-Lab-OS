vantage_backend:
  name: Hamilton Vantage自动化移液工作站
  name_en: Hamilton Vantage liquid handling workstation
  manufacturer: Hamilton
  category:
  - 移液工作站
  tags:
  - 备料&前处理设备
  - 实验执行&合成设备
  - 实验室自动化与仪器集成
  - 溶液配制与反应
  - 移液站产品
  - 液体输送与定量分配
  - 实验室机械臂自动化与样品搬运
  - 移液工作站
  description: Hamilton Vantage 自动化移液工作站，用于实验室自动移液、吸头装卸、液体吸取与分配、96通道板级处理、液面探测，以及通过集成夹爪搬运微孔板等实验耗材。
  description_en: The Hamilton Vantage is an automated liquid handling workstation
    used for laboratory pipetting, tip pickup and ejection, liquid aspiration and
    dispensing, 96-channel plate processing, liquid level detection, and moving microplates
    or other labware with an integrated gripper.
