phoxx_laser:
  name: PhoxX 二极管激光器
  name_en: PhoxX diode laser
  manufacturer: Omicron-Laserage Laserprodukte GmbH
  category:
  - 二极管激光器
  - 实验室激光光源
  tags:
  - 实验执行&合成设备
  - 光学与光谱实验
  - 激光激发与光谱测量
  - 显微成像与光学显微实验
  - 二极管激光器
  - 实验室激光光源
  description: PhoxX 是 Omicron-Laserage 的 OEM 二极管激光器系列，可提供可调激光输出并支持高速调制，常用于显微成像、荧光激发和光学检测系统。
  description_en: PhoxX is an OEM diode-laser series from Omicron-Laserage, offering
    controllable laser output and high-speed modulation for microscopy, fluorescence
    excitation, and optical instrumentation.
  actions:
    auto-IsOn:
      description: 获取激光器是否开启
      description_en: Get whether the laser is on.
    auto-TurnOn:
      description: 打开激光输出
      description_en: Turn on laser emission.
    auto-TurnOff:
      description: 关闭激光输出
      description_en: Turn off laser emission.
    auto-SetPower:
      description: 设置激光输出功率
      description_en: Set the laser output power.
    auto-Close:
      description: 关闭设备连接
      description_en: Close the device connection.
    auto-GetOutputmW:
      description: 获取当前输出功率（毫瓦）
      description_en: Get the current output power in milliwatts.
    auto-GetStatusText:
      description: 获取设备状态文本
      description_en: Get the device status text.
    auto-GetPower:
      description: 获取功率设定值
      description_en: Get the configured power setting.
