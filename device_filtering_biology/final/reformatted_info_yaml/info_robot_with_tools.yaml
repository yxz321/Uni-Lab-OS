robot_with_tools:
  name: Mecademic机械臂
  name_en: Mecademic robotic arm
  manufacturer: Mecademic
  category:
  - 机械臂
  tags:
  - 物流/机械
  - 实验室自动化与仪器集成
  - 实验室机械臂自动化与样品搬运
  - 机械臂
  description: 用于实验自动化的机械臂控制对象，可执行机器人激活、回零/归位、断开连接，并检查IO模块状态；同时包含运动队列参数与初始化配置的脏标记管理，便于在测试或实验前将机器人恢复到已知状态。
  description_en: A robotic arm control object for lab automation that can activate
    the robot, home it, disconnect it, and check IO module presence. It also manages
    dirty-state tracking for motion queue parameters and initialization settings so
    the robot can be restored to a known state before experiments or tests.
  actions:
    auto-HasIoModule:
      description: 检查机器人是否已连接或检测到IO模块。
      description_en: Check whether the robot's IO module is connected or detected.
    auto-ActivateRobot:
      description: 激活机械臂，并将运动队列相关设置标记为需重新下发。
      description_en: Activate the robotic arm and mark motion-queue-related settings
        for reapplication.
    auto-DeactivateRobot:
      description: 停用机械臂，并将运动队列相关设置标记为需重新下发。
      description_en: Deactivate the robotic arm and mark motion-queue-related settings
        for reapplication.
    auto-ActivateAndHome:
      description: 激活机械臂并执行回零/归位，同时将运动队列相关设置标记为需重新下发。
      description_en: Activate the robotic arm and perform homing, while marking motion-queue-related
        settings for reapplication.
    auto-Disconnect:
      description: 断开与机械臂的连接，并将运动队列相关设置标记为需重新下发。
      description_en: Disconnect from the robotic arm and mark motion-queue-related
        settings for reapplication.
    auto-set_dirty_if_params_changed:
      description: 当运动队列参数发生变化时，标记相关配置为脏状态。
      description_en: Mark related configuration as dirty when motion queue parameters
        have changed.
    auto-clear_dirty_flags:
      description: 清除配置脏标记，重置初始化后的状态跟踪。
      description_en: Clear dirty flags and reset post-initialization state tracking.
    auto-is_cmd_dirty:
      description: 检查指定机器人命令对应的配置自上次初始化后是否已变更。
      description_en: Check whether the configuration associated with a specified
        robot command has changed since the last initialization.
    auto-set_if_dirty:
      description: 仅在对应配置为脏状态时，才向机械臂发送指定设置命令。
      description_en: Send a specified setting command to the robotic arm only when
        the related configuration is marked dirty.
