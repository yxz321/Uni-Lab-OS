byonoy_absorbance96_automate_backend:
  name: Byonoy Absorbance 96 酶标仪
  name_en: Byonoy Absorbance 96 Plate Reader
  manufacturer: Byonoy
  category:
  - 酶标仪
  tags:
  - 表征设备
  - 生命体系
  - 智慧表征与检测中心
  - 微孔板检测与高通量筛选
  - 酶标仪
  description: 这是一款面向96孔微孔板的吸光度酶标仪，用于在选定波长下测量各孔样品的吸光度信号。它适用于ELISA、比色分析以及其他基于微孔板的常规实验检测。
  description_en: This is a 96-well microplate absorbance reader used to measure sample
    absorbance in plate wells at selected wavelengths. It is suitable for ELISA, colorimetric
    assays, and other routine microplate-based laboratory measurements.
  actions:
    auto-initialize_measurements:
      description: 执行参考吸光度初始化测量。
      description_en: Perform the reference absorbance initialization measurement.
    auto-read_absorbance:
      description: 测量微孔板指定孔位在指定波长下的吸光度。
      description_en: Measure absorbance in selected plate wells at the specified
        wavelength.
    auto-read_fluorescence:
      description: 测量微孔板指定孔位在给定激发波长、发射波长和焦高条件下的荧光信号。
      description_en: Measure fluorescence in selected plate wells using the given
        excitation wavelength, emission wavelength, and focal height.
    auto-read_luminescence:
      description: 测量微孔板指定孔位在给定焦高条件下的发光信号。
      description_en: Measure luminescence in selected plate wells at the given focal
        height.
    auto-setup:
      description: 初始化并准备酶标仪进行测量。
      description_en: Initialize and prepare the plate reader for measurement.
    auto-send_command:
      description: 向设备发送底层命令。
      description_en: Send a low-level command to the device.
    auto-get_available_absorbance_wavelengths:
      description: 获取可用吸光度波长。
      description_en: Get available absorbance wavelengths.
