toptica_i_beam_laser:
  name: TOPTICA iBeam 激光器
  name_en: TOPTICA iBeam Laser
  manufacturer: TOPTICA
  category:
  - 二极管激光器
  - 实验室激光光源
  - 显微照明光源
  tags:
  - 实验执行&合成设备
  - 光学与光谱实验
  - 激光激发与光谱测量
  - 显微成像与光学显微实验
  - 二极管激光器
  - 实验室激光光源
  - 显微照明光源
  description: 用于实验室光学实验的可控激光光源，可进行激光开关和输出功率设置/读取，适合显微成像、激发照明等场景。
  description_en: A controllable laser light source for laboratory optical experiments,
    supporting laser emission on/off control and output power set/readback. It is
    suitable for applications such as microscopy and excitation illumination.
  actions:
    auto-IsOn:
      description: 获取激光发射是否开启。
      description_en: Get whether laser emission is on.
    auto-TurnOn:
      description: 开启激光发射。
      description_en: Turn on laser emission.
    auto-TurnOff:
      description: 关闭激光发射。
      description_en: Turn off laser emission.
    auto-SetPower:
      description: 设置激光输出功率。
      description_en: Set the laser output power.
    auto-GetPower:
      description: 读取激光输出功率。
      description_en: Read the laser output power.
