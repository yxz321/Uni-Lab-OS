spool_local_localization_rule:
  name: 本地定位处理规则
  name_en: Spool Local Localization Rule
  manufacturer: ''
  category:
  - 定位分析工作流规则
  tags:
  - 表征设备
  - 实验数据可视化与分析
  - 实验数据管理与记录
  - 显微定位重建与集群分析
  - 定位分析工作流规则
  description: 用于实验数据流程中的非物理软件规则组件。它表示一种本地定位处理规则，用于在数据采集或本地缓存完成后触发定位分析相关流程，并提供总帧数、数据完成状态等规则状态信息。
  description_en: A non-physical software rule component used in experimental data
    workflows. It represents a local localization processing rule that can trigger
    localization-analysis-related steps after acquisition or local spooling is complete,
    and exposes rule status such as total frame count and data completion state.
  actions:
    auto-on_data_complete:
      description: 在数据完成时触发本地定位处理规则
      description_en: trigger the local localization processing rule when data is
        complete
