spectra_iii_light_engine:
  name: Spectra III 光源引擎
  name_en: Spectra III Light Engine
  manufacturer: Lumencor
  category:
  - 显微照明光源
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 可调光谱照明与光照实验
  - 显微照明光源
  description: 用于显微成像与荧光实验的多通道激发光源系统，可通过串口连接并管理多个颜色通道。各通道可对应 LED、发光光导或激光，用于为样品提供不同波段的照明。
  description_en: A multi-channel excitation light source system for microscopy and
    fluorescence experiments. It connects over a serial port and manages multiple
    color channels. Individual channels may correspond to LEDs, luminescent light
    pipes, or lasers to provide illumination at different wavelengths.
  actions:
    auto-devices:
      description: 枚举光源引擎中可用的光通道设备名称，例如蓝光、近红外或紫光等颜色通道。
      description_en: Enumerate the available light-channel device names in the light
        engine, such as blue, near-infrared, or violet channels.
