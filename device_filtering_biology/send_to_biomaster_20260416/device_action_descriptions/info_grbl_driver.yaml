grbl_driver:
  name: GRBL三轴运动平台
  name_en: GRBL 3-Axis Motion Stage
  manufacturer: ''
  category:
  - 电动定位台
  tags:
  - 物流/机械
  - 精密定位与运动控制
  - 样品/探针定位与运动控制
  - 电动定位台
  description: 这是一种基于 GRBL 控制器的三轴电动运动平台，通常由 Arduino Uno 与 CNC Shield 驱动 X、Y、Z 轴步进电机。设备支持回零、限位开关、相对/绝对定位，以及简单的激光强度和
    LED 控制，可用于实验室中的样品托盘、载台或小型自动化机构的移动、定位与振动操作。
  description_en: This is a GRBL-based 3-axis motorized motion stage, typically driven
    by an Arduino Uno and CNC shield to control X, Y, and Z stepper motors. It supports
    homing, limit switches, relative and absolute positioning, and simple laser intensity
    and LED control, making it useful for moving, positioning, and shaking sample
    plates, stages, or small laboratory automation mechanisms.
  actions:
    auto-write_global_config:
      description: 写入运动控制器的全局配置，如回零速度和限位开关参数。
      description_en: Write the global motion-controller configuration, such as homing
        speed and limit-switch parameters.
    auto-write_all_settings:
      description: 写入该运动平台的全部轴参数和控制设置。
      description_en: Write all axis parameters and controller settings for the motion
        stage.
    auto-verify_settings:
      description: 核对当前 GRBL 设置是否与目标运动平台配置一致。
      description_en: Verify that the current GRBL settings match the intended motion-stage
        configuration.
    auto-shake_plate:
      description: 让载板或样品板执行摇动运动。
      description_en: Shake the plate or sample holder with a programmed motion.
    auto-move_rel:
      description: 按相对位移移动 XYZ 轴。
      description_en: Move the XYZ axes by a relative displacement.
    auto-move_abs:
      description: 移动到指定的绝对 XYZ 位置。
      description_en: Move to a specified absolute XYZ position.
    auto-move_xyz:
      description: 控制运动平台在 XYZ 坐标中移动。
      description_en: Move the motion stage in XYZ coordinates.
    auto-xmove:
      description: 移动 X 轴。
      description_en: Move the X axis.
    auto-ymove:
      description: 移动 Y 轴。
      description_en: Move the Y axis.
    auto-zmove:
      description: 移动 Z 轴。
      description_en: Move the Z axis.
    auto-home:
      description: 执行各轴回零。
      description_en: Home the axes.
    auto-zhome:
      description: 执行 Z 轴回零。
      description_en: Home the Z axis.
    auto-check_alarm:
      description: 检查运动控制器的报警状态。
      description_en: Check the alarm state of the motion controller.
    auto-reset_stage:
      description: 复位运动平台控制器。
      description_en: Reset the motion-stage controller.
    auto-current_position:
      description: 读取当前位置信息。
      description_en: Read the current position.
    auto-zero_position:
      description: 将当前位置定义为零点。
      description_en: Define the current position as the zero origin.
    auto-set_laser_intensity:
      description: 设置激光输出强度。
      description_en: Set the laser output intensity.
    auto-set_led:
      description: 设置 LED 开关状态。
      description_en: Set the LED on/off state.
    auto-soft_reset:
      description: 执行软复位并尽量保持当前位置记录。
      description_en: Perform a soft reset while preserving the current position record
        as much as possible.
    auto-controlled_stop:
      description: 以受控减速方式停止运动。
      description_en: Stop motion with controlled deceleration.
    auto-stop:
      description: 紧急停止所有运动。
      description_en: Emergency-stop all motion.
    auto-alarm_reset:
      description: 复位并清除报警状态。
      description_en: Reset and clear the alarm state.
    auto-close:
      description: 关闭与运动控制器的通信。
      description_en: Close communication with the motion controller.
    auto-get_positions:
      description: 获取当前位置。
      description_en: Get the current position.
    auto-get_status_report:
      description: 获取状态报告。
      description_en: Get the status report.
