thorlabs_fw102_c:
  name: 索雷博可编程滤光轮
  name_en: Thorlabs Programmable Filter Wheel
  manufacturer: Thorlabs
  category:
  - 电动滤光片转轮
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 电动滤光片转轮
  description: 用于显微成像或光学实验中的多工位滤光片切换装置，证据指向 Thorlabs FW102C 系列滤光轮。设备可切换不同滤光片位置，常用于荧光显微、激发/发射通道选择等场景；由于设备本体带有手动控制，实验过程中通常需要查询当前位置。
  description_en: A multi-position optical filter switching device for microscopy
    and general optics work, with evidence pointing to the Thorlabs FW102C family
    of filter wheels. It is used to change filter positions for applications such
    as fluorescence imaging and excitation/emission channel selection; because the
    hardware also has manual controls, the current position may need to be queried
    during experiments.
  actions:
    initialize:
      description: 初始化滤光轮设备并建立可用的控制连接。
      description_en: Initialize the filter wheel and establish a usable control connection.
