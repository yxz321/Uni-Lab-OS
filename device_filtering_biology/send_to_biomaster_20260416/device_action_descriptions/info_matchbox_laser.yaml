matchbox_laser:
  name: MatchBox紧凑型激光器
  name_en: MatchBox Compact Laser
  manufacturer: Integrated Optics
  category:
  - 二极管激光器
  - 实验室激光光源
  tags:
  - 表征设备
  - 光学与光谱实验
  - 激光激发与光谱测量
  - 显微成像与光学显微实验
  - 二极管激光器
  - 实验室激光光源
  description: 一种紧凑型激光模块，用于为实验中的光学激发、荧光照明、对准和一般激光光源需求提供稳定输出。常见于显微成像、光学实验和仪器集成场景。
  description_en: A compact laser module used to provide stable optical excitation
    for fluorescence illumination, alignment, and general laser source needs in laboratory
    setups. It is commonly used in microscopy, optical experiments, and instrument
    integration.
  actions:
    auto-IsOn:
      description: 获取激光器是否开启
      description_en: Get whether the laser is on
    auto-TurnOn:
      description: 开启激光器输出
      description_en: Turn on the laser output
    auto-TurnOff:
      description: 关闭激光器输出
      description_en: Turn off the laser output
    auto-SetPower:
      description: 设置激光输出功率
      description_en: Set the laser output power
    auto-getOutputPowerDAC:
      description: 获取输出功率DAC设定值
      description_en: Get the output power DAC setting
    auto-GetPower:
      description: 获取激光输出功率
      description_en: Get the laser output power
