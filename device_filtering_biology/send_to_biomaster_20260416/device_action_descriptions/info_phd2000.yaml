phd2000:
  name: PHD2000注射泵
  name_en: PHD2000 Syringe Pump
  manufacturer: Harvard
  category:
  - 注射泵
  tags:
  - 实验执行&合成设备
  - 溶液配制与反应
  - 液体输送与定量分配
  - 注射泵
  description: PHD2000是一款实验室注射泵，用于驱动注射器进行精确的液体注入或回抽。它适合需要按设定体积输送液体的实验场景，如样品输送、流体控制和常规实验室给液。
  description_en: The PHD2000 is a laboratory syringe pump used to drive a syringe
    for precise liquid infusion or withdrawal. It is suited to experiments that require
    delivery of a defined liquid volume, such as sample delivery, fluid handling,
    and general laboratory dosing.
  actions:
    auto-stop:
      description: 停止注射泵。
      description_en: Stop the syringe pump.
    auto-settargetvolume:
      description: 设置注入或回抽的目标体积。
      description_en: Set the target volume for infusion or withdrawal.
