fire_sting:
  name: FireSting 多通道光学氧测量仪
  name_en: FireSting Multi-Channel Optical Oxygen Meter
  manufacturer: PyroScience
  category:
  - 光学氧测量仪
  tags:
  - 表征设备
  - 传感测量与环境感知
  - 溶解氧与气体氧监测
  - 光学氧测量仪
  description: FireSting 是一类用于连接光学氧传感器的多通道氧测量仪，可对液体或气体样品中的氧信号进行光学测量，并结合温度、压力和盐度参数进行补偿计算。它常用于实验室中的溶解氧、氧饱和度和相关氧参数监测。
  description_en: The FireSting is a multi-channel optical oxygen meter designed to
    work with optical oxygen sensors. It performs optical oxygen measurements in liquid
    or gas samples and can apply temperature, pressure, and salinity compensation.
    It is commonly used in laboratories for dissolved oxygen, oxygen saturation, and
    related oxygen monitoring.
  actions:
    auto-measure:
      description: 测量设备所有通道的氧信号及相关补偿参数。
      description_en: Measure oxygen signals and related compensated values on all
        device channels.
    auto-led_intensity:
      description: 获取/设置各通道测量光源的 LED 强度。
      description_en: Get/set the LED intensity of the measurement light source for
        all channels.
    auto-measure_time:
      description: 获取/设置各通道的测量时间。
      description_en: Get/set the measurement time for all channels.
    auto-amplification:
      description: 获取/设置各通道的信号放大倍数。
      description_en: Get/set the signal amplification for all channels.
    auto-frequency:
      description: 获取/设置各通道的调制频率。
      description_en: Get/set the modulation frequency for all channels.
    auto-blink:
      description: 让设备闪烁标识灯并触发所有通道的光学测量，用于识别设备。
      description_en: Flash the device logo and trigger an optical measurement on
        all channels to help identify the device.
    auto-disconnect:
      description: 断开与设备的连接。
      description_en: Disconnect the device.
