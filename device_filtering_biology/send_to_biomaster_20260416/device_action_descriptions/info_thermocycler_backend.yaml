thermocycler_backend:
  name: 热循环仪抽象控制后端
  name_en: Thermocycler Abstract Backend
  manufacturer: ''
  category:
  - 普通PCR仪
  tags:
  - 实验执行&合成设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 基因编辑、分子生物学与育种
  - 实验仪器通信与驱动集成
  - 普通PCR仪
  description: 用于热循环仪的非物理软件抽象组件。它定义了开关盖、设置模块与热盖温度、停用加热、执行热循环协议，以及读取温度、盖状态、步骤与循环进度等统一控制接口，供具体热循环仪设备实现使用。
  description_en: A non-physical abstract software component for thermocyclers. It
    defines a unified control interface for opening and closing the lid, setting block
    and lid temperatures, deactivating heating, running thermocycling protocols, and
    reading temperatures, lid state, and protocol progress, to be implemented by concrete
    thermocycler devices.
  actions:
    auto-open_lid:
      description: 打开热循环仪盖子的控制接口；这是非物理抽象后端中定义的开盖操作。
      description_en: Control interface to open the thermocycler lid; this is an open-lid
        operation defined by the non-physical abstract backend.
    auto-close_lid:
      description: 关闭热循环仪盖子的控制接口；这是非物理抽象后端中定义的关盖操作。
      description_en: Control interface to close the thermocycler lid; this is a close-lid
        operation defined by the non-physical abstract backend.
    auto-set_block_temperature:
      description: 设置热循环仪模块温度的控制接口，可用于一个或多个温区。
      description_en: Control interface to set the thermocycler block temperature,
        including one or more temperature zones.
    auto-set_lid_temperature:
      description: 设置热循环仪热盖温度的控制接口，可用于一个或多个温区。
      description_en: Control interface to set the thermocycler lid temperature, including
        one or more temperature zones.
    auto-deactivate_block:
      description: 停用热循环仪模块加热的控制接口。
      description_en: Control interface to deactivate thermocycler block heating.
    auto-deactivate_lid:
      description: 停用热循环仪热盖加热的控制接口。
      description_en: Control interface to deactivate thermocycler lid heating.
    auto-run_protocol:
      description: 执行热循环协议的控制接口，按阶段、步骤和循环次数运行，并考虑模块最大反应体积限制。
      description_en: Control interface to execute a thermocycling protocol by stages,
        steps, and repeats, while considering the block maximum reaction volume.
    auto-get_block_current_temperature:
      description: 获取热循环仪模块当前温度的接口。
      description_en: Interface to get the current thermocycler block temperature.
    auto-get_block_target_temperature:
      description: 获取热循环仪模块目标温度的接口。
      description_en: Interface to get the target thermocycler block temperature.
    auto-get_lid_current_temperature:
      description: 获取热循环仪热盖当前温度的接口。
      description_en: Interface to get the current thermocycler lid temperature.
    auto-get_lid_target_temperature:
      description: 获取热循环仪热盖目标温度的接口。
      description_en: Interface to get the target thermocycler lid temperature.
    auto-get_lid_open:
      description: 获取热循环仪盖子是否打开的接口。
      description_en: Interface to get whether the thermocycler lid is open.
    auto-get_lid_status:
      description: 获取热循环仪热盖温控状态的接口。
      description_en: Interface to get the thermocycler lid temperature-control status.
    auto-get_block_status:
      description: 获取热循环仪模块温控状态的接口。
      description_en: Interface to get the thermocycler block temperature-control
        status.
    auto-get_hold_time:
      description: 获取当前保温剩余时间的接口，单位为秒。
      description_en: Interface to get the remaining hold time in seconds.
    auto-get_current_cycle_index:
      description: 获取当前循环序号的接口，采用从零开始的索引。
      description_en: Interface to get the current cycle index, using zero-based indexing.
    auto-get_total_cycle_count:
      description: 获取协议总循环次数的接口。
      description_en: Interface to get the total cycle count of the protocol.
    auto-get_current_step_index:
      description: 获取当前循环内步骤序号的接口，采用从零开始的索引。
      description_en: Interface to get the current step index within the cycle, using
        zero-based indexing.
    auto-get_total_step_count:
      description: 获取当前循环内步骤总数的接口。
      description_en: Interface to get the total number of steps in the current cycle.
