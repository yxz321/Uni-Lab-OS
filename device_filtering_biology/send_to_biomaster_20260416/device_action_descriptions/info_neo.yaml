neo:
  name: Andor Neo科学CMOS相机
  name_en: Andor Neo sCMOS Camera
  manufacturer: Andor
  category:
  - 科学相机
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 实验成像与机器视觉
  - 科学相机
  description: Andor Neo是一款科学级CMOS相机，用于实验室中的低噪声、高灵敏度二维成像。它常用于显微成像、光学检测和需要可调曝光、传感器读出与区域选取的科学图像采集实验。
  description_en: The Andor Neo is a scientific CMOS camera for low-noise, high-sensitivity
    2D imaging in laboratories. It is commonly used for microscopy, optical measurements,
    and scientific image acquisition experiments that require adjustable exposure,
    sensor readout settings, and region-of-interest selection.
  actions:
    auto-initialize:
      description: 初始化相机并准备采集。
      description_en: Initialize the camera and prepare it for acquisition.
    auto-take_image_async:
      description: 异步启动图像采集。
      description_en: Start image acquisition asynchronously.
    auto-pixel_encoding:
      description: 设置像素编码格式。
      description_en: Set the pixel encoding format.
    auto-sensor_size:
      description: 获取传感器尺寸。
      description_en: Get the sensor dimensions.
    auto-clock_rate:
      description: 设置像素时钟速率。
      description_en: Set the pixel clock rate.
    auto-fan_peed:
      description: 设置风扇转速。
      description_en: Set the fan speed.
    auto-sensor_temp:
      description: 获取传感器温度。
      description_en: Get the sensor temperature.
    auto-exposure_time:
      description: 获取或设置曝光时间。
      description_en: Get or set the exposure time.
    auto-roi:
      description: 定义感兴趣区域。
      description_en: Define the region of interest.
    auto-take_image:
      description: 采集图像，可进行单次或多帧缓冲采集。
      description_en: Acquire image data, including single-image or buffered multi-frame
        acquisition.
