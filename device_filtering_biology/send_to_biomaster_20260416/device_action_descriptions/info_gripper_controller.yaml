gripper_controller:
  name: Robotiq 三指自适应机械夹爪
  name_en: Robotiq 3-Finger Adaptive Gripper
  manufacturer: Robotiq
  category:
  - 机器人电动夹爪
  - 自适应三指夹爪
  tags:
  - 实验执行&合成设备
  - 物流/机械
  - 实验室自动化与仪器集成
  - 机器人与移动平台
  - 实验室机械臂自动化与样品搬运
  - 实验室机器人操作与样品转运
  - 机器人电动夹爪
  - 自适应三指夹爪
  description: 这是一种安装在机器人末端的电动三指自适应夹爪，可通过位置、速度、力度和不同抓取模式控制手指运动，以夹持形状各异的工件。它常用于实验室自动化和机器人系统中的样品、器件或治具的抓取、搬运与定位。
  description_en: This is an electric three-finger adaptive robot gripper mounted
    on a robotic end effector. Its fingers can be controlled by position, speed, force,
    and grasping mode to handle objects of different shapes. It is commonly used in
    laboratory automation and robotic systems for grasping, transferring, and positioning
    samples, parts, or fixtures.
  actions:
    auto-activate:
      description: 激活夹爪，使其进入可操作状态。
      description_en: Activate the gripper and prepare it for operation.
    auto-command_gripper:
      description: 按设定的位置、速度、力度和模式控制夹爪执行张开或抓取动作。
      description_en: Control the gripper to open or grasp using the specified position,
        speed, force, and operating mode.
    auto-status:
      description: 获取夹爪当前状态。
      description_en: Get the current gripper status.
    auto-close:
      description: 关闭与夹爪的控制会话。
      description_en: Close the control session with the gripper.
    auto-add_leading_zeros:
      description: 将夹爪相关二进制数据补零到固定长度。
      description_en: Pad gripper-related binary data with leading zeros to a fixed
        length.
    auto-Byte_status:
      description: 解析夹爪状态字节中的各个状态字段。
      description_en: Parse the individual status fields in a gripper status byte.
    auto-stat:
      description: 解析并定义夹爪的模式与状态位。
      description_en: Parse and define the gripper mode and status bits.
