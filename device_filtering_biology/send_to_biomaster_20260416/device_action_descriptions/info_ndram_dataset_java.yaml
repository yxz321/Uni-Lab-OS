ndram_dataset_java:
  name: 内存多维图像数据集存储
  name_en: In-Memory Multidimensional Image Dataset Storage
  manufacturer: ''
  category:
  - 内存实验项目存储后端
  - 实验数据集对象
  tags:
  - 表征设备
  - 实验数据管理与记录
  - 显微成像与光学显微实验
  - 实验项目数据缓存与临时持久化
  - 内存实验项目存储后端
  - 实验数据集对象
  description: 这是一个用于显微成像采集流程的软件数据存储组件，在 RAM 中保存多维图像及其元数据，并按通道、Z 层、时间点、位置、行列等坐标建立索引，便于实验过程中快速判断图像是否存在、读取图像内容以及读取对应元数据。
  description_en: This is a software data storage component for microscopy acquisition
    workflows. It stores multidimensional images and their metadata in RAM and indexes
    them by coordinates such as channel, z, time, position, row, and column for fast
    checking, retrieval of image data, and retrieval of metadata during experiments.
  actions:
    auto-close:
      description: 关闭内存数据集存储
      description_en: Close the in-memory dataset storage.
    auto-add_available_axes:
      description: 登记新图像对应的可用坐标轴组合
      description_en: Register the available axis-coordinate combination for a newly
        received image.
    auto-is_finished:
      description: 检查数据集写入是否已完成
      description_en: Check whether dataset writing has finished.
    auto-has_image:
      description: 检查指定坐标是否存在图像
      description_en: Check whether an image exists at the specified coordinates.
    auto-read_image:
      description: 读取指定坐标的图像数据
      description_en: Read image data at the specified coordinates.
    auto-read_metadata:
      description: 读取指定坐标的图像元数据
      description_en: Read image metadata at the specified coordinates.
