  actions:
    auto-to_python:
      description: 将机械臂的积木程序转换为 Python 控制脚本。
      description_en: Convert the robot arm's block-based program into a Python control
        script.
    auto-codes:
      description: 获取积木程序代码。
      description_en: Get the block-based program code.
