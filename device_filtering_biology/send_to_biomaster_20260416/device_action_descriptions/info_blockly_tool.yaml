blockly_tool:
  name: xArm协作机械臂
  name_en: xArm Collaborative Robot Arm
  manufacturer: UFACTORY
  category:
  - 机械臂
  tags:
  - 物流/机械
  - 机器人与移动平台
  - 实验室自动化与仪器集成
  - 样品/探针定位与运动控制
  - 机械臂
  - 实验室机械臂自动化与样品搬运
  description: 一款可编程协作机械臂，可通过图形化积木程序或 Python 脚本控制运动流程、关节动作和实验操作。常用于教学演示、实验室自动化、样品搬运及机械臂流程开发。
  description_en: A programmable collaborative robot arm that can be controlled through
