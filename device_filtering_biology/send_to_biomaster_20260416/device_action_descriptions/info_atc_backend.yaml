atc_backend:
  name: Opentrons ATC 自动热循环仪
  name_en: Opentrons Automated Thermocycler
  manufacturer: Opentrons
  category:
  - 普通PCR仪
  tags:
  - 实验执行&合成设备
  - 生命体系
  - 基因编辑、分子生物学与育种
  - 普通PCR仪
  description: 用于PCR等核酸扩增流程的自动热循环仪模块，提供程序化温度循环（变性、退火、延伸）并配备可开合加热上盖，支持在自动化实验流程中进行板式样本温控。
  description_en: An automated thermocycler module for PCR and related nucleic acid
    amplification workflows, providing programmed temperature cycling (denaturation,
    annealing, extension) with an opening heated lid for plate-based sample temperature
    control in automated lab protocols.
  actions:
    auto-close_lid:
      description: 关闭仪器上盖。
      description_en: Close the instrument lid.
    auto-open_lid:
      description: 打开仪器上盖。
      description_en: Open the instrument lid.
