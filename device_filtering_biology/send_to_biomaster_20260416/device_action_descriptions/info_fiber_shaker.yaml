fiber_shaker:
  name: 光纤振动器
  name_en: Fiber Shaker
  manufacturer: ''
  category:
  - 光纤振动器
  tags:
  - 实验执行&合成设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 激光激发与光谱测量
  - 光纤振动器
  description: 光纤振动器是一种用于机械振动光纤的实验装置，常用于激光照明路径中，通过持续扰动光纤来降低散斑并改善照明均匀性，适合显微成像等光学实验。
  description_en: A fiber shaker is a laboratory device that mechanically vibrates
    an optical fiber. It is commonly used in laser illumination paths to reduce speckle
    and improve illumination uniformity, especially in microscopy and other optical
    experiments.
  actions:
    auto-TurnOn:
      description: 开启光纤振动器。
      description_en: Turn on the fiber shaker.
    auto-TurnOff:
      description: 关闭光纤振动器。
      description_en: Turn off the fiber shaker.
    auto-Notify:
      description: 通知控制系统当前是否需要保持光纤振动器开启。
      description_en: Notify the control system whether the fiber shaker should be
        kept on.
