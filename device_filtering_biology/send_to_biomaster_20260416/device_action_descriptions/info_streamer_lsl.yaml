streamer_lsl:
  name: OpenBCI 生物电采集板（LSL流输出）
  name_en: OpenBCI biosignal acquisition board with LSL streaming
  manufacturer: OpenBCI
  category:
  - 生物电信号采集板
  - 实验数据流传输器
  tags:
  - 表征设备
  - 生命体系
  - 实验室自动化与仪器集成
  - 脑机接口与生理电信号采集
  - 实验仪器数据采集与联机控制
  - 生物电信号采集板
  - 实验数据流传输器
  description: 用于初始化和控制 OpenBCI 生物电采集板，并将采集到的多通道数据通过 Lab Streaming Layer（LSL）发布。代码证据显示其可进行串口板卡初始化、默认通道配置、菊花链接入设置、开始/停止采集以及通道位置信息管理，适合脑电等生理信号实验的数据采集与实时流传输。
  description_en: Used to initialize and control an OpenBCI biosignal acquisition
    board and publish multichannel data through Lab Streaming Layer (LSL). The evidence
    shows serial board initialization, default channel configuration, daisy-module
    handling, start/stop acquisition, and channel location metadata management, making
    it suitable for EEG and related biosignal experiments with real-time streaming.
  actions:
    auto-initialize_board:
      description: 初始化采集板，并设置自动检测、端口或菊花链等参数。
      description_en: Initialize the acquisition board and set options such as autodetection,
        port, or daisy expansion.
    auto-init_board_settings:
      description: 设置采集板的默认配置，如初始通道数等。
      description_en: Set the default board configuration, such as the initial channel
        count.
    auto-set_board_settings:
      description: 将当前板卡配置应用到设备。
      description_en: Apply the current board settings to the device.
    auto-send:
      description: 发送一帧采样数据到流输出。
      description_en: Send one sample frame to the stream output.
    auto-create_lsl:
      description: 创建 LSL 流信息与输出通道，并设置元数据和通道信息。
      description_en: Create the LSL stream information and outlet, including metadata
        and channel information.
    auto-cleanUp:
      description: 清理采集与流输出相关资源。
      description_en: Clean up resources related to acquisition and stream output.
    auto-start_streaming:
      description: 开始从采集板采集并输出实时数据流。
      description_en: Start acquiring from the board and output a real-time data stream.
    auto-stop_streaming:
      description: 停止数据流，并清理串口缓冲等残留状态。
      description_en: Stop the data stream and clear leftover state such as serial
        input buffers.
    auto-begin:
      description: 初始化板卡状态，执行基础控制命令，并启动采集流程。
      description_en: Initialize the board state, issue basic control commands, and
        start the acquisition process.
    auto-change_locations:
      description: 修改通道位置信息，用于更新流中的电极位置元数据。
      description_en: Change channel location information to update electrode position
        metadata in the stream.
