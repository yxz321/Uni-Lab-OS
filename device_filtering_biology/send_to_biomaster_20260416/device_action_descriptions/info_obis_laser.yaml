obis_laser:
  name: OBIS 激光器
  name_en: OBIS Laser
  manufacturer: Coherent
  category:
  - 实验室激光光源
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 激光激发与光谱测量
  - 实验室激光光源
  description: OBIS 激光器是一种实验室激光光源，常用于显微成像和其他光学实验中的受控照明与激发。它可作为显微镜光源使用，提供稳定激光输出，并支持开关状态与触发方式控制。
  description_en: An OBIS laser is a laboratory laser light source commonly used for
    controlled illumination and excitation in microscopy and other optical experiments.
    It serves as a microscope light source, providing stable laser output with controllable
    on/off state and trigger behavior.
  actions:
    auto-get_status:
      description: 获取设备状态
      description_en: get device status
    auto-initialize:
      description: 初始化激光器通信与控制模式
      description_en: initialize laser communication and control mode
    auto-get_is_on:
      description: 获取激光器当前是否能够出光
      description_en: get whether the laser is currently able to emit light
    auto-trigger_type:
      description: 获取触发类型
      description_en: get trigger type
    auto-trigger_mode:
      description: 获取触发模式
      description_en: get trigger mode
    auto-set_trigger:
      description: 设置触发类型和触发模式
      description_en: set trigger type and trigger mode
