resources:
  name: VENUS资源类生成工具
  name_en: VENUS Resource Class Generator
  manufacturer: Hamilton
  category:
  - 实验自动化资源类生成器
  tags:
  - 备料&前处理设备
  - 实验室自动化与仪器集成
  - 移液站产品
  - 实验软件对象模型与属性同步
  - 实验自动化资源类生成器
  description: 这是一个非物理的软件辅助组件，用于读取 Hamilton VENUS 的实验室自动化资源文件，如甲板布局、液体类别数据库和子方法库，并将其转换为可在
    Python 中调用的资源类，便于在自动化实验脚本中复用系统配置与方法定义。
  description_en: This is a non-physical software helper component that reads Hamilton
    VENUS laboratory automation resource files, such as deck layouts, liquid class
    databases, and submethod libraries, and converts them into Python classes for
    reuse in automation scripts and workflow definitions.
  actions:
    auto-read_layout:
      description: 读取VENUS布局文件并生成对应的Python资源类。
      description_en: Read a VENUS layout file and generate the corresponding Python
        resource class.
    auto-read_liquid_classes:
      description: 读取VENUS液体类别数据库并生成Python液体类别定义。
      description_en: Read the VENUS liquid class database and generate Python liquid
        class definitions.
    auto-read_submethods:
      description: 读取VENUS子方法库并生成对应的Python类定义。
      description_en: Read VENUS submethod libraries and generate corresponding Python
        class definitions.
