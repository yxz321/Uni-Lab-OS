cool_led:
  name: CoolLED pE系列显微镜LED照明控制器
  name_en: CoolLED pE Series Microscope LED Illumination Controller
  manufacturer: CoolLED
  category:
  - LED光源控制器
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - LED光源控制器
  description: 这是一类用于显微镜的多通道LED照明控制器与光源系统，常见于荧光显微成像。设备可提供多个独立波段通道（如A到H），用于激发不同荧光染料，并支持通道选择、开关和TTL触发控制。
  description_en: A multi-channel LED illumination controller and light source system
    for microscopes, commonly used in fluorescence imaging. It provides multiple independent
    wavelength channels (such as A to H) for exciting different fluorophores, with
    channel selection, on/off control, and TTL triggering.
  actions:
    auto-devices:
      description: 获取该控制器管理的各个独立照明通道。
      description_en: Get the individual illumination channels managed by the controller.
