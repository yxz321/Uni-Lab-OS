hamamatsu_hardware:
  name: 滨松科学相机
  name_en: Hamamatsu Scientific Camera
  manufacturer: Hamamatsu
  category:
  - 科学相机
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 实验成像与过程监测
  - 科学相机
  description: 这是一台滨松科学相机，用于实验中的高灵敏图像采集。它支持曝光时间、触发方式、采集模式以及子区域/分区读出设置，适合显微成像、光学测量和其他需要同步触发与快速连续采集的实验。
  description_en: This is a Hamamatsu scientific camera used for sensitive image acquisition
    in laboratory experiments. It supports exposure control, trigger configuration,
    acquisition modes, and subarray/ROI readout, making it suitable for microscopy,
    optical measurements, and other experiments requiring synchronized triggering
    and rapid image capture.
  actions:
    auto-setup:
      description: 初始化相机的控制参数与子区域读出相关设置。
      description_en: Initialize camera control parameters and subarray readout-related
        settings.
    auto-connect:
      description: 连接相机并加载当前的采集、触发和输出触发极性设置。
      description_en: Connect to the camera and load the current acquisition, trigger,
        and output trigger polarity settings.
    auto-disconnect:
      description: 断开相机连接并释放设备控制，同时恢复默认参数值。
      description_en: Disconnect the camera and release device control while restoring
        default parameter values.
    auto-readOnlyWhenOpt:
      description: 在最佳偏移模式下将子区域位置设为不可修改，以避免错误更改。
      description_en: Make the subarray position non-editable in optimal offset mode
        to prevent unintended changes.
    auto-updateCameraSettings:
      description: 将当前相机采集与触发相关参数更新到设备中。
      description_en: Update the camera with the current acquisition- and trigger-related
        settings.
