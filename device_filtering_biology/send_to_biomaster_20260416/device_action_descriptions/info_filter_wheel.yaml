filter_wheel:
  name: 电动滤光轮
  name_en: Motorized Filter Wheel
  manufacturer: Focal
  category:
  - 电动滤光片转轮
  tags:
  - 表征设备
  - 光学与光谱实验
  - 显微成像与光学显微实验
  - 电动滤光片转轮
  description: 电动滤光轮是一种用于在光路中安装并切换多片滤光片的光学设备。它可将不同滤光片快速移入或移出光束路径，常用于显微成像、荧光实验、相机检测和一般光学实验中的波段选择与光路切换。
  description_en: A motorized filter wheel is an optical device that holds multiple
    filters and switches them into or out of the beam path. It is commonly used for
    wavelength selection and optical path switching in microscopy, fluorescence experiments,
    camera-based detection, and general optical laboratory setups.
  actions:
    auto-RW:
      description: 向滤光轮发送底层命令并读取返回值。
      description_en: Send a low-level command to the filter wheel and read back the
        response.
    auto-getPosition:
      description: 获取当前滤光片位置。
      description_en: Get the current filter position.
    auto-setPositionq:
      description: 将滤光轮切换到指定位置（q 模式）。
      description_en: Move the filter wheel to the specified position (q mode).
    auto-setPositionf:
      description: 将滤光轮切换到指定位置（f 模式）。
      description_en: Move the filter wheel to the specified position (f mode).
    auto-zero:
      description: 将滤光轮回零到基准位置。
      description_en: Return the filter wheel to its zero or home reference position.
