gsioc_interface:
  name: GSIOC兼容实验室仪器
  name_en: GSIOC-compatible laboratory instrument
  manufacturer: ''
  category:
  - GSIOC兼容液体处理仪器
  tags:
  - 备料&前处理设备
  - 实验执行&合成设备
  - 实验室自动化与仪器集成
  - 移液站产品
  - GSIOC串行仪器控制
  - GSIOC兼容液体处理仪器
  description: 这类设备是支持 GSIOC 串行通信协议的实验室仪器，通常通过 RS-422/485 总线连接，并可在同一总线上按单元地址进行选择与控制。它们常见于实验室自动化场景，用于样品处理、流体输送或其他需要串行联机控制的仪器系统。
  description_en: This device class comprises laboratory instruments that support
    the GSIOC serial communication protocol, typically over an RS-422/485 bus. They
    can be addressed and controlled by unit ID on a shared serial bus and are commonly
    used in lab automation setups for sample handling, fluid transfer, or other instrument
    control tasks.
  actions:
    auto-connect:
      description: 连接到串行总线上指定单元地址的 GSIOC 仪器。
      description_en: Connect to the GSIOC instrument with the specified unit ID on
        the serial bus.
    auto-connect_async:
      description: 以异步方式连接到串行总线上指定单元地址的 GSIOC 仪器。
      description_en: Asynchronously connect to the GSIOC instrument with the specified
        unit ID on the serial bus.
    auto-immediate_command:
      description: 向 GSIOC 仪器发送即时查询命令并读取返回信息。
      description_en: Send an immediate query command to the GSIOC instrument and
        read back its response.
    auto-immediate_command_async:
      description: 以异步方式向 GSIOC 仪器发送即时查询命令并读取返回信息。
      description_en: Asynchronously send an immediate query command to the GSIOC
        instrument and read back its response.
    auto-buffered_command:
      description: 向 GSIOC 仪器发送缓冲指令命令以执行控制操作。
      description_en: Send a buffered instruction command to the GSIOC instrument
        to perform a control operation.
    auto-buffered_command_async:
      description: 以异步方式向 GSIOC 仪器发送缓冲指令命令以执行控制操作。
      description_en: Asynchronously send a buffered instruction command to the GSIOC
        instrument to perform a control operation.
