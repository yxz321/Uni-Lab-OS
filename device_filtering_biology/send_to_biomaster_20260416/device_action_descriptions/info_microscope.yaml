microscope:
  name: 透射电子显微镜（TEM/STEM）
  name_en: Transmission Electron Microscope (TEM/STEM)
  manufacturer: Thermo Fisher Scientific (formerly FEI)
  category:
  - 透射电子显微镜
  tags:
  - 表征设备
  - 智慧表征与检测中心
  - 真空系统与高真空实验
  - 物化表征测试中心
  - 透射电镜与冷冻电镜成像
  - 透射电子显微镜
  description: 这是一类高真空电子显微镜，可在透射电子显微镜和扫描透射电子显微镜模式下工作，用于样品的高分辨成像、电子衍射和相关检测。设备通常包含电子枪、镜筒与真空系统、载物台、荧光屏、相机以及
    STEM 探测器，可调节电子束偏转、束斑、会聚角、放大倍率、焦距和像散等参数，常用于材料、纳米结构和薄样品分析。
  description_en: This is a high-vacuum electron microscope that operates in transmission
    electron microscopy and scanning transmission electron microscopy modes for high-resolution
    imaging, electron diffraction, and related detection of specimens. The instrument
    typically includes an electron column with vacuum system, stage, viewing screen,
    cameras, and STEM detectors, and allows control of beam deflection, spot size,
    convergence angle, magnification, focus, and stigmation for materials, nanostructure,
    and thin-sample analysis.
