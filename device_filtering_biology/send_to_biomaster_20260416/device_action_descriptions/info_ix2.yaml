ix2:
  name: 奥林巴斯 IX2 倒置显微镜机身
  name_en: Olympus IX2 inverted microscope body
  manufacturer: Olympus
  category:
  - 普通光学显微镜
  tags:
  - 表征设备
  - 生命体系
  - 显微成像与光学显微实验
  - 细胞生物学研究
  - 普通光学显微镜
  description: 奥林巴斯 IX2 是实验室用倒置显微镜机身，用于承载物镜、照明与调焦机构，并对样品进行显微观察。该类设备常用于细胞培养、活体样品观察、荧光成像及常规生物显微实验中的
    Z 轴调焦和机身状态控制。
  description_en: The Olympus IX2 is an inverted microscope body used in laboratories
    to support the objective turret, illumination, and focusing mechanisms for microscopic
    sample observation. It is commonly used for cell culture work, live-sample observation,
    fluorescence imaging, and general biological microscopy involving Z-axis focusing
    and microscope body status control.
  actions:
    auto-query:
      description: 向显微镜机身发送查询命令。
      description_en: Send a query command to the microscope body.
    auto-idn:
      description: 读取设备身份信息。
      description_en: Get the device identification information.
    auto-lamp_status:
      description: 获取/设置照明灯状态。
      description_en: Get/set the illumination lamp status.
    auto-soft_limits:
      description: 获取/设置软限位。
      description_en: Get/set the soft limits.
    auto-movement_status:
      description: 获取运动状态。
      description_en: Get the movement status.
    auto-move_relative:
      description: 使机身调焦机构按相对位移移动。
      description_en: Move the microscope focusing mechanism by a relative displacement.
    auto-z:
      description: 获取/设置 Z 轴位置。
      description_en: Get/set the Z-axis position.
    auto-init_origin:
      description: 初始化原点位置。
      description_en: Initialize the origin position.
