shaker:
  name: 实验室板式振荡器
  name_en: Laboratory Plate Shaker
  manufacturer: ''
  category:
  - 振荡器（非恒温）
  tags:
  - 备料&前处理设备
  - 溶液配制与反应
  - 微孔板样品孵育与混匀
  - 振荡器（非恒温）
  description: 用于对实验样品板进行振荡混匀的实验室设备，可按设定转速运行指定时长或连续运行，并支持锁定/解锁样品板以保证振荡过程中的稳定性。
  description_en: A laboratory device used to shake and mix sample plates. It can
    run at a specified speed for a set duration or continuously, and supports locking/unlocking
    the plate to keep it secure during shaking.
  actions:
    auto-shake:
      description: 以指定转速启动振荡，可设置持续时间或连续运行。
      description_en: Start shaking at the specified speed, optionally for a set duration
        or continuously.
    auto-stop_shaking:
      description: 停止振荡。
      description_en: Stop shaking.
    auto-lock_plate:
      description: 锁定样品板。
      description_en: Lock the plate.
    auto-unlock_plate:
      description: 解锁样品板。
      description_en: Unlock the plate.
    auto-serialize:
      description: 序列化设备配置与状态信息。
      description_en: Serialize the device configuration and state information.
