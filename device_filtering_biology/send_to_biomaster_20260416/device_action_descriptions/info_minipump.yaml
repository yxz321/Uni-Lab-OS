minipump:
  name: 微量液体泵
  name_en: Microfluidic Pump
  manufacturer: ''
  category:
  - 微流控液体泵
  tags:
  - 实验执行&合成设备
  - 溶液配制与反应
  - 液体输送与定量分配
  - 微流控液体泵
  description: 一种用于输送微升级液体的实验室泵，可按设定体积、流速和方向推动液体通过管路。常用于微流控、样品传输、试剂加样和流路预充等实验操作。
  description_en: A laboratory pump for moving microliter-scale liquids through tubing
    with defined volume, flow rate, and direction. It is commonly used for microfluidics,
    sample transfer, reagent delivery, and priming fluid lines.
  actions:
    auto-primePump:
      description: 按设定体积、流速和方向对泵路进行预充液。
      description_en: Prime the pump line with the specified volume, flow rate, and
        direction.
    auto-runPump:
      description: 启动液体泵运行。
      description_en: Start the pump.
    auto-stopPump:
      description: 停止液体泵运行。
      description_en: Stop the pump.
    auto-readPump:
      description: 读取液体泵的当前状态或返回信息。
      description_en: Read the current pump status or returned information.
    auto-read:
      description: 读取设备当前返回信息。
      description_en: Read the current response from the device.
